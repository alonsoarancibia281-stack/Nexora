name: Backtest

on:
  # El disparo manual sólo aparece cuando el workflow vive en la rama por
  # defecto, así que en ramas de trabajo se lanza al tocar el banco de pruebas.
  push:
    branches: ['claude/**', 'agent/**']
    paths:
      - 'tool/**'
      - 'lib/features/pulse/domain/**'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Rondas de 5 minutos a evaluar'
        required: false
        default: '11000'
      archive:
        description: 'Incluir el archivo histórico de patrones (más lento)'
        required: false
        default: 'true'
      flow_days:
        description: 'Días de tape de aggTrades a reconstruir (0 = sin microestructura)'
        required: false
        default: '5'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run backtest
        run: |
          # Without pipefail the exit status of `tee` would hide a crash.
          set -o pipefail
          ROUNDS="${{ github.event.inputs.rounds }}"
          # Un mes largo de mercado: suficiente para separar régimenes.
          ROUNDS="${ROUNDS:-11000}"
          ARCHIVE_FLAG=""
          if [ "${{ github.event.inputs.archive }}" = "false" ]; then
            ARCHIVE_FLAG="--no-archive"
          fi
          FLOW_DAYS="${{ github.event.inputs.flow_days }}"
          # El flujo ya es un término del consenso, así que el A/B merece más
          # rondas de las que bastaban para descartarlo. Diez días son unas
          # 2900 rondas y caben de sobra en el tiempo del job.
          FLOW_DAYS="${FLOW_DAYS:-10}"
          # Con microestructura la corrida es un A/B sobre las mismas rondas,
          # así que se mide en un único punto de decisión.
          dart run tool/backtest.dart --rounds "$ROUNDS" --flow "$FLOW_DAYS" $ARCHIVE_FLAG | tee backtest-report.txt
      - name: Prueba de información del flujo
        run: |
          set -o pipefail
          dart run tool/flow_information.dart --days 30 | tee -a backtest-report.txt
      - name: Publish report in the job summary
        if: always()
        run: |
          {
            echo '## Backtest'
            echo ''
            echo '```'
            grep -E 'microestructura|Microestructura|Acierto del motor|Movimiento ya realizado|Ventaja del motor|Contradice|Con lectura|Sin lectura|Rondas evaluadas' backtest-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest-report.txt
          if-no-files-found: warn
          retention-days: 14
