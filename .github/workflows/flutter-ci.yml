name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']
    paths-ignore:
      - 'releases/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Generate Android wrapper
        run: flutter create --platforms=android --org ai.nexora --project-name nexora_markets_ai .
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-mvp-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK in repository
        if: github.event_name == 'push'
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/Nexora-MVP.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f releases/Nexora-MVP.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged; nothing to publish.'
          else
            git commit -m 'build: publish Nexora MVP APK [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
